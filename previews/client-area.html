<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balamani • Client area preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#30302c;font:16px/1.6 'Segoe UI',sans-serif}header,main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1,h2,h3{font-family:Georgia,serif;line-height:1.2}h1{font-size:42px;margin:12px 0}h2{font-size:26px}p{color:#68665f}button,input{font:inherit}button{cursor:pointer;border:1px solid #d7c29a;border-radius:8px;padding:10px 17px;background:white;color:#655025}button.primary{background:#765a28;color:white;border-color:#765a28}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #b58a3c;outline-offset:3px}input{width:100%;padding:11px;border:1px solid #c9c4ba;border-radius:7px;margin:6px 0 18px}label{display:block;font-weight:600}.banner{background:#ece5d6;padding:12px 24px;text-align:center;font-size:14px}.card{background:white;border:1px solid #e3dccd;border-radius:16px;padding:28px;margin:20px 0}.narrow{max-width:580px;margin:30px auto}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.small{font-size:14px}.eyebrow{color:#876d3b;text-transform:uppercase;letter-spacing:2px;font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:20px}.calendar>*{text-align:center}.day{padding:10px 0;border:0;background:#f4f1e9;min-height:44px}.blocked{background:#e7e5e1;color:#777;text-decoration:line-through}.selected{background:#765a28;color:white}.badge{display:inline-block;background:#f2e8cd;color:#745722;border-radius:20px;padding:3px 12px;font-size:13px}.booking{border-top:1px solid #eee;padding:16px 0}.notice{color:#765a28;font-weight:600}nav{display:flex;gap:8px}button[aria-pressed=true]{background:#30302c;color:white;border-color:#30302c}@media(max-width:760px){.split{grid-template-columns:1fr}header{align-items:start;gap:16px;flex-direction:column}h1{font-size:32px}.card{padding:20px}main{padding:16px}}
</style>
<div class="banner">Interactive preview · No email is sent and no real account is created. Demo data lasts until you reload.</div>
<header><div><strong style="font:25px Georgia">Balamani</strong><div class="eyebrow">A little home away from home</div></div><nav aria-label="Preview role"><button id="adminTab" onclick="screen='admin';render()">Owner view</button><button id="clientTab" onclick="showClient()">Client view</button></nav></header>
<main id="app"></main>
<script>
const app=document.getElementById('app');let screen='admin',email='',clientName='',dog='',activated=false,invited=false,requests=[],blocked=new Set(),selection='';let month=new Date();month=new Date(month.getFullYear(),month.getMonth(),1);const today=key(new Date());
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showClient(){screen=activated?'client':invited?'invite':'waiting';render()}
function calendar(owner){let cells=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<span class="small">'+d+'</span>').join('');let offset=(month.getDay()+6)%7;cells+='<span></span>'.repeat(offset);for(let i=1;i<=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();i++){let d=key(new Date(month.getFullYear(),month.getMonth(),i));cells+=`<button class="day ${blocked.has(d)?'blocked':''} ${selection===d?'selected':''}" ${d<today?'disabled':''} aria-label="${d}, ${blocked.has(d)?'unavailable':'open for requests'}" onclick="pick('${d}',${owner})">${i}</button>`}return `<div class="row" style="justify-content:space-between"><button aria-label="Previous month" onclick="move(-1)">←</button><strong>${month.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</strong><button aria-label="Next month" onclick="move(1)">→</button></div><div class="calendar">${cells}</div><p class="small">Cream: open for requests · Crossed out: unavailable</p>`}
function move(n){month.setMonth(month.getMonth()+n);render()}
function pick(d,owner){if(owner){blocked.has(d)?blocked.delete(d):blocked.add(d);render()}else if(!blocked.has(d)){selection=d;document.getElementById('arrival').value=d;document.getElementById('departure').min=d}}
function bookings(owner){return requests.length?requests.map((r,i)=>`<div class="booking"><div class="row"><strong>${esc(r.dog)}</strong><span class="badge">${r.status}</span></div><div>${r.start} → ${r.end}</div>${owner?`<p class="small">${esc(clientName)} · ${esc(email)}</p>`:''}${owner&&r.status==='Pending'?`<div class="row"><button class="primary" onclick="decide(${i},'Confirmed')">Approve stay</button><button onclick="decide(${i},'Declined')">Decline</button></div>`:''}</div>`).join(''):'<p>No booking requests yet.</p>'}
function decide(i,status){let r=requests[i];if(status==='Confirmed'&&overlap(r.start,r.end)){alert('This stay includes a blocked date. Reopen the date before approving.');return}r.status=status;render()}
function overlap(a,b){for(let d=new Date(a+'T12:00:00');key(d)<=b;d.setDate(d.getDate()+1)){if(blocked.has(key(d)))return true}return false}
function render(){document.getElementById('adminTab').setAttribute('aria-pressed',screen==='admin');document.getElementById('clientTab').setAttribute('aria-pressed',screen!=='admin');if(screen==='admin'){app.innerHTML=`<div class="eyebrow">Owner dashboard</div><h1>A warm welcome, by invitation.</h1><p>Invite your puppy families and manage their pet-sitting requests.</p><div class="split"><div><section class="card"><h2>Pet-sitting calendar</h2><p class="small">Click a date to block or reopen it. Confirmed stays do not automatically close dates while capacity is unset.</p>${calendar(true)}</section><section class="card"><h2>Booking requests</h2>${bookings(true)}</section></div><div><section class="card"><h2>Invite a client</h2><p>Try the invitation journey using one of your email addresses.</p><form onsubmit="invite(event)"><label for="email">Client email</label><input id="email" type="email" autocomplete="email" required value="${esc(email)}" ${activated?'disabled':''}><button class="primary" ${activated?'disabled':''}>Preview invitation</button></form>${invited?'<p class="notice">Demo invitation ready.</p><button onclick="showClient()">Open client invitation →</button>':''}</section><section class="card"><h3>You stay in control</h3><p class="small">All stays require your approval. Clients see their own requests and the shared open/blocked dates.</p><p class="small">Switch between views to try both sides. This preview shares data within this tab only.</p></section></div></div>`}
else if(screen==='waiting'){app.innerHTML='<section class="card narrow"><h1>Your private client area</h1><p>Access is by invitation. Start in Owner view and enter your email to preview an invitation.</p><button onclick="screen=\'admin\';render()">Go to Owner view</button></section>'}
else if(screen==='invite'){app.innerHTML=`<section class="card narrow"><div class="eyebrow">Invitation email preview</div><p class="small">To: ${esc(email)}</p><h1>Welcome to the Balamani family.</h1><p>You’ve been invited to your private client area. Request pet-sitting dates and keep track of your dog’s upcoming stays.</p><button class="primary" onclick="screen='setup';render()">Accept invitation</button><p class="small">This button simulates the secure link you would receive by email.</p></section>`}
else if(screen==='setup'){app.innerHTML=`<section class="card narrow"><div class="eyebrow">Your invitation</div><h1>Make yourself at home.</h1><p>${esc(email)}</p><form onsubmit="activate(event)"><label for="name">Your name</label><input id="name" autocomplete="name" required maxlength="100"><label for="dog">Your dog’s name</label><input id="dog" required maxlength="100"><p class="small">Real account setup will use a secure email link and password setup. No password is collected in this demo.</p><button class="primary">Enter demo client area</button></form></section>`}
else{app.innerHTML=`<div class="eyebrow">Your private client area</div><h1>Welcome, ${esc(clientName)}.</h1><p>A familiar place for ${esc(dog)} while you’re away.</p><div class="split"><section class="card"><h2>Plan a stay</h2><p>Choose dates to request. We’ll review your stay before confirming.</p>${calendar(false)}<form onsubmit="requestStay(event)"><label for="arrival">Arrival</label><input type="date" id="arrival" required min="${today}" value="${selection}"><label for="departure">Departure</label><input type="date" id="departure" required min="${today}"><button class="primary">Request these dates</button><p id="feedback" role="status" class="notice"></p></form></section><section class="card"><h2>Your stays</h2>${bookings(false)}<p class="small">A pending request does not reserve a space. We’ll confirm after reviewing your dates.</p></section></div>`}}
function invite(e){e.preventDefault();email=document.getElementById('email').value.trim();invited=true;screen='invite';render()}
function activate(e){e.preventDefault();clientName=document.getElementById('name').value.trim();dog=document.getElementById('dog').value.trim();if(!clientName||!dog)return;activated=true;screen='client';render()}
function requestStay(e){e.preventDefault();let start=document.getElementById('arrival').value,end=document.getElementById('departure').value;const feedback=document.getElementById('feedback');if(end<start){feedback.textContent='Departure must be on or after arrival.';return}if(overlap(start,end)){feedback.textContent='Your stay includes an unavailable date. Please choose other dates.';return}if(requests.some(r=>r.start===start&&r.end===end&&r.status!=='Declined')){feedback.textContent='You already requested these dates.';return}requests.push({start,end,dog,status:'Pending'});render();document.getElementById('feedback').textContent='Request received. Awaiting approval.'}
render();
</script></html>
